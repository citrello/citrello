name: Deploy bridge (mcp.citrello.app)

# Deploys the Cloudflare Worker in bridge/ whenever it changes on main, or by hand (Actions → Run workflow).
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   required
#   RESEND_API_KEY (or RESEND_API_KEY_CITRELLO)    sends the sign-in emails
#   BRIDGE_ADMIN_TOKEN                             protects /admin (user numbers, feature emails)
on:
  push:
    branches: [main]
    paths: ["bridge/**", ".github/workflows/bridge.yml", "tests/test_bridge_e2e.py", "tests/test_web_bridge_e2e.py",
            # Claude checks: the bridge's AI endpoints and the screen that uses them
            "tests/test_bridge_ai_e2e.py", "tests/anthropic_mock.py", "ui.html", "sources.py"]
  workflow_dispatch:

concurrency: bridge-deploy

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy --dry-run --outdir dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx citeproc-py pypdf pybtex pytest playwright
      - run: python -m playwright install --with-deps chromium webkit
      - name: Build the web app (the browser tab is a device too)
        run: python packaging/build_web_check.py
        working-directory: .
      - name: End-to-end tests against a local copy of the bridge (the desktop app, and the web app in Chromium and WebKit)
        run: |
          npx wrangler d1 migrations apply citrello --local
          # Claude checks go to a pretend Claude API (tests/anthropic_mock.py, started by the tests): nothing is paid for
          npx wrangler dev --port 8787 --var DEV_RETURN_CODES:1 --var ADMIN_TOKEN:testadmin --var PUBLIC_URL:http://localhost:8787 \
            --var ANTHROPIC_BASE_URL:http://127.0.0.1:8799 --var ANTHROPIC_API_KEY:test-key --var AI_FREE_MONTHLY:6 > wrangler.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 1; done
          (cd ../site/public && python -m http.server 8099 > /dev/null 2>&1 &)
          sleep 1
          cd .. && CITRELLO_BRIDGE_E2E=1 CITRELLO_BRIDGE=http://localhost:8787 CITRELLO_WEB_CHECK=http://localhost:8099 \
            pytest -q tests/test_bridge_e2e.py tests/test_bridge_ai_e2e.py tests/test_web_bridge_e2e.py || { cat bridge/wrangler.log; exit 1; }

  deploy:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || secrets.RESEND_API_KEY_CITRELLO }}
      BRIDGE_ADMIN_TOKEN: ${{ secrets.BRIDGE_ADMIN_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip when Cloudflare isn't set up yet
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the bridge."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.ready.outputs.go == 'true'
      - name: Find or create the database
        if: steps.ready.outputs.go == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="citrello") | .uuid'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create citrello; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
      - name: Update the database tables
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply citrello --remote
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy
      - name: Set secrets
        if: steps.ready.outputs.go == 'true'
        run: |
          [ -n "$RESEND_API_KEY" ] && printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          [ -n "$BRIDGE_ADMIN_TOKEN" ] && printf '%s' "$BRIDGE_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] && printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          true
