name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the built files to a release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx citeproc-py pypdf pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx citeproc-py pypdf pyinstaller pillow
      - name: Draw the icon
        run: python brand_icon.py citrello.ico
      - name: Build Citrello.exe (the app)
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name Citrello --icon citrello.ico --add-data "ui.html;." --add-data "clip.html;." --add-data "styles;styles" --collect-data docx --collect-data citeproc app.py
      - name: Build CitrelloMCP.exe (the Claude connector)
        run: python -m PyInstaller --noconfirm --onefile --console --name CitrelloMCP --icon citrello.ico --add-data "styles;styles" --collect-data docx --collect-data citeproc mcp_server.py
      - name: Build Citrello.mcpb (one-click Claude Desktop extension)
        run: python make_mcpb.py dist\CitrelloMCP.exe dist\Citrello.mcpb
      - name: End-to-end tests of the built app (a browser uses it like a person; online)
        shell: pwsh
        env:
          CITRELLO_APP_CMD: dist\Citrello.exe
          CITRELLO_MCP_CMD: dist\CitrelloMCP.exe
          CITRELLO_E2E_ONLINE: "1"
          CITRELLO_E2E_SHOTS: e2e-screenshots
        run: |
          pip install pytest playwright
          python -m playwright install chromium
          python -m pytest -v tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-windows
          path: e2e-screenshots
      - name: Build the Microsoft Store package (.msix)
        env:
          # From Partner Center -> Product identity (repository variables, not secrets)
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: python packaging\make_msix.py dist
      - name: Install-test the Store package (test-signed) and call the connector through its alias
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $subject = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { "CN=Citrello" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject -KeyUsage DigitalSignature -FriendlyName "Citrello CI test" `
            -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "ci-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe" | Select-Object -Last 1).FullName
          Copy-Item (Get-ChildItem dist\Citrello-*.msix).FullName test.msix
          & $signtool sign /fd SHA256 /f test.pfx /p ci-test test.msix
          if ($LASTEXITCODE) { throw "signing failed" }
          Add-AppxPackage -Path test.msix
          Get-AppxPackage *Citrello* | Format-List Name, Version, InstallLocation
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\citrello-mcp.exe"
          if (-not (Test-Path $alias)) { throw "alias citrello-mcp.exe was not created" }
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $out = ($init, $list) | & $alias
          $out
          if (-not ($out -match '"citrello"') -or -not ($out -match 'search_references')) { throw "the packaged connector did not answer" }
          Remove-AppxPackage (Get-AppxPackage *Citrello*).PackageFullName
      - name: Zip the Windows download (one folder with the three files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\zip\Citrello | Out-Null
          Copy-Item dist\Citrello.exe, dist\CitrelloMCP.exe, dist\Citrello.mcpb dist\zip\Citrello\
          Compress-Archive -Path dist\zip\Citrello -DestinationPath dist\Citrello-windows.zip -Force
      - name: Update test (install the app, offer it as a new version, click Update)
        run: python tests\update_smoke.py dist\Citrello-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Citrello-windows
          path: |
            dist/Citrello-windows.zip
            dist/Citrello.exe
            dist/CitrelloMCP.exe
            dist/Citrello.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: Citrello-store-package
          path: dist/Citrello-*.msix
      - name: Attach to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Citrello-windows.zip
            dist/Citrello.exe
            dist/CitrelloMCP.exe
            dist/Citrello.mcpb
          generate_release_notes: true

  mac:
    needs: test
    runs-on: macos-14   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Citrello.app, the connector and the Claude extension
        run: bash packaging/build_mac.sh
      - name: Smoke test (app, online lookup, connector)
        run: |
          export CITRELLO_HOME="$RUNNER_TEMP/lib" CITRELLO_ACCOUNT_FILE="$RUNNER_TEMP/acct.json"
          dist/Citrello.app/Contents/MacOS/Citrello --no-browser > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 40); do curl -sf http://localhost:8585/api/ping > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8585/api/ping
          # an HTTPS lookup proves the bundled certificates work
          curl -sf -X POST -H "Content-Type: application/json" -H "Origin: http://localhost:8585" \
            -d '{"text":"10.1016/j.renene.2016.10.066"}' http://localhost:8585/api/library/add | tee "$RUNNER_TEMP/add.json"
          grep -q '"ok": true' "$RUNNER_TEMP/add.json"
          curl -sf http://localhost:8585/api/claude | tee "$RUNNER_TEMP/claude.json"; echo
          grep -q '"extension_file": "/' "$RUNNER_TEMP/claude.json"
          printf '%s\n%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_references","arguments":{"query":"decommissioning"}}}' \
            | dist/Citrello.app/Contents/MacOS/CitrelloMCP | tee "$RUNNER_TEMP/mcp.txt"
          grep -q Topham2017 "$RUNNER_TEMP/mcp.txt"
          curl -s -X POST -H "Origin: http://localhost:8585" http://localhost:8585/api/quit || true
      - name: End-to-end tests of the built app (a browser uses it like a person; online)
        env:
          CITRELLO_APP_CMD: dist/Citrello.app/Contents/MacOS/Citrello
          CITRELLO_MCP_CMD: dist/Citrello.app/Contents/MacOS/CitrelloMCP
          CITRELLO_E2E_ONLINE: "1"
          CITRELLO_E2E_SHOTS: e2e-screenshots
        run: |
          python3 -m pip install pytest playwright
          python3 -m playwright install chromium
          python3 -m pytest -v tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-mac
          path: e2e-screenshots
      - name: Update test (install the app, offer it as a new version, click Update)
        run: python3 tests/update_smoke.py dist/Citrello-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Citrello-mac
          path: |
            dist/Citrello-mac.zip
            dist/Citrello-mac.mcpb
      - name: Attach to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Citrello-mac.zip
            dist/Citrello-mac.mcpb
