<!doctype html><html><head><meta charset="utf-8"><title>App C · Search first</title><link rel="stylesheet" href="common.css"><style>
body{background:#fff}
.head{background:var(--lemon);padding:18px 0 34px;position:relative;z-index:0}
.head::after{content:"";position:absolute;left:0;right:0;bottom:-28px;height:28px;background:url(../public/tile.svg) repeat-x left center/28px 28px}
.wrap{max-width:980px;margin:0 auto;padding:0 28px}
.bar{display:flex;justify-content:space-between;align-items:center}
.logo{font:28px Gloock,serif;color:var(--cobalt)}.logo span{color:var(--leaf)}
.links{display:flex;gap:22px;font-weight:600;color:var(--cobalt)}.links b{border-bottom:3px solid var(--cobalt)}
h1{font:400 46px Gloock,serif;color:var(--cobalt);margin:26px 0 14px}
.search{display:flex;background:#fff;border:3px solid var(--cobalt);border-radius:18px;padding:6px 6px 6px 18px;align-items:center;box-shadow:6px 6px 0 var(--cobalt)}
.search input{flex:1;border:0;font-size:18px;padding:10px 0;outline:none}
.search button{background:var(--cobalt);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:700 15px Figtree,sans-serif}
.helper{font-size:14px;color:var(--cobalt);margin-top:10px}
main.wrap{padding-top:64px}
.line{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:10px}
.line .chips{display:flex;gap:8px}.line .acts{display:flex;gap:16px;font-weight:600;color:var(--cobalt)}
.ref{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.ref .t{font:400 19px/1.3 Gloock,serif;color:var(--ink)}.ref .m{color:var(--muted);font-size:14px;margin-top:3px}
.ref .side{text-align:right}.ref .side .pill{margin-bottom:6px}
</style></head><body>
<div class="head"><div class="wrap"><div class="bar"><div class="logo">citr<span>ello</span></div><div class="links"><b>Library</b><span>Documents</span><span>Settings</span></div></div>
<h1>What are you citing?</h1>
<div class="search"><input placeholder="Search your library, or paste a DOI, a link or a reference to add it"><button>Search or add</button></div>
<div class="helper">7 references in your library · Thesis project</div></div></div>
<main class="wrap"><div class="line"><div class="chips"><span class="pill verified">3 verified</span><span class="pill check">1 to check</span><span class="pill problem">2 problems</span></div>
<div class="acts"><span>Import</span><span>Export</span><span>Verify online</span></div></div><div id="list"></div></main>
<script src="data.js"></script><script>
document.getElementById("list").innerHTML=REFS.map(r=>`<div class="ref"><div><div class="t">${r.title}</div><div class="m">${r.meta}${r.doi?" · "+r.doi:""}</div>${r.issue?`<div class="issue ${r.rel}">${r.issue}</div>`:""}</div>
<div class="side"><span class="pill ${r.rel}">${REL[r.rel]}</span><br><span class="key">${r.key}</span></div></div>`).join("");
</script></body></html>
