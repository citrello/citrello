# Citrello bridge (Cloudflare Worker). See bridge/README.md.
name = "citrello-bridge"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false  # served only at mcp.citrello.app
routes = [{ pattern = "mcp.citrello.app", custom_domain = true }]

[vars]
PUBLIC_URL = "https://mcp.citrello.app"
MAIL_FROM = "Citrello <hello@citrello.app>"
# Claude checks (src/ai.js): Sonnet for verdicts and library checks (Armin, 12 Nov); Haiku for the web search step
# of web checks, ~3-5 cents instead of ~20 (Armin, 13 Nov): Sonnet then checks the papers it finds on their full text
AI_MODEL = "claude-sonnet-5-5"
AI_WEB_MODEL = "claude-haiku-5-5"

[[d1_databases]]
binding = "DB"
database_name = "citrello"
database_id = "00000000-0000-0000-0000-000000000000"  # replaced by the deploy workflow
migrations_dir = "migrations"

# The cloud copy of web-app libraries (src/cloud.js): an R2 bucket kept in the EU
[[r2_buckets]]
binding = "CLOUD"
bucket_name = "citrello-cloud"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
