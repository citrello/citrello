<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to Citrello</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #9b1c31; --accent-ink: #ffffff; --accent-soft: #f6e8ea;
    --ok: #1f7a4d; --ok-soft: #e5f3ec; --warn: #9a6200; --warn-soft: #fbf1de; --err: #b3261e; --err-soft: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161618; --card: #1f1f22; --ink: #ececee; --muted: #9a9aa1; --line: #33333a;
      --accent: #e0627a; --accent-ink: #1a0b0f; --accent-soft: #3a1f26;
      --ok: #5cc392; --ok-soft: #173126; --warn: #e2b04f; --warn-soft: #362a12; --err: #f08a80; --err-soft: #3b1d1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 24px; }
  h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .title { font-weight: 650; font-size: 16px; line-height: 1.35; }
  .meta { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; margin: 8px 6px 0 0; background: var(--bg); border: 1px solid var(--line); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.bad { background: var(--err-soft); color: var(--err); border-color: transparent; }
  ul.issues { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  ul.issues li.problem { color: var(--err); } ul.issues li.check { color: var(--warn); }
  .notice { padding: 10px 12px; border-radius: 10px; margin-top: 12px; font-size: 14px; }
  .notice.ok { background: var(--ok-soft); color: var(--ok); } .notice.err { background: var(--err-soft); color: var(--err); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 14px; }
  input { font: inherit; width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px; border-radius: 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  code { font-size: 13px; background: var(--bg); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: -4px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .small { font-size: 12.5px; color: var(--muted); margin-top: 10px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1><span>Citrello</span> · add to library</h1>
  <div id="loading" class="card"><span class="spinner"></span>Looking up this page…</div>
  <div id="found" class="hidden">
    <div class="card">
      <div class="title" id="title"></div>
      <div class="meta" id="meta"></div>
      <div id="tags"></div>
      <div id="issues"></div>
    </div>
    <div id="existing" class="notice ok hidden"></div>
    <label>Project (optional)<input id="project" list="projects" placeholder="e.g. the paper you're writing"></label>
    <datalist id="projects"></datalist>
    <div class="row">
      <button class="primary" id="add">Add to library</button>
      <button id="close">Close</button>
    </div>
  </div>
  <div id="done" class="hidden">
    <div class="notice ok" id="doneMsg"></div>
    <div class="row"><button class="primary" id="copy">Copy citation marker</button><button id="close2">Close</button></div>
  </div>
  <div id="error" class="notice err hidden"></div>
  <div class="small" id="source"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const show = (id, on = true) => $(id).classList.toggle("hidden", !on);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let clip = null, rec = null, key = null;

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function fail(msg) { show("loading", false); $("error").textContent = msg; show("error"); }

async function start() {
  try { clip = JSON.parse(decodeURIComponent(location.hash.slice(1))); }
  catch (e) { return fail("Nothing to add. Use the “Add to Citrello” button on your bookmarks bar while viewing a paper."); }
  history.replaceState(null, "", "/clip");  // keep the page data out of the address bar
  $("source").textContent = clip.sel && clip.sel.length > 30 ? "From the text you selected on " + clip.url : "From " + clip.url;
  try {
    const r = await post("/api/clip/preview", clip);
    rec = r.rec;
    const c = rec.csl;
    show("loading", false); show("found");
    $("title").textContent = c.title || "(no title)";
    const names = (c.author || []).map((a) => a.family || a.literal).filter(Boolean);
    const au = names.length > 2 ? names[0] + " et al." : names.join(" & ");
    const year = c.issued && c.issued["date-parts"] ? c.issued["date-parts"][0][0] : "n.d.";
    $("meta").textContent = [au, year, c["container-title"] || c.publisher, c.DOI].filter(Boolean).join(" · ");
    const rel = {verified: ['ok', '✓ Verified'], check: ['warn', 'Check'], problem: ['bad', 'Problem'], complete: ['', 'Complete']}[rec.reliability] || ['', ''];
    $("tags").innerHTML = (rel[1] ? `<span class="tag ${rel[0]}">${rel[1]}</span>` : "") + `<span class="tag">${esc((c.type || "").replace("article-journal", "journal article").replace("paper-conference", "conference paper"))}</span>`;
    $("issues").innerHTML = rec.checks && rec.checks.length ? `<ul class="issues">${rec.checks.map((x) => `<li class="${x.level}">${esc(x.text)}</li>`).join("")}</ul>` : "";
    $("projects").innerHTML = (r.projects || []).map((p) => `<option value="${esc(p)}">`).join("");
    try { $("project").value = localStorage.getItem("citrello-last-project") || ""; } catch (e) {}
    if (r.existing) {
      $("existing").innerHTML = `Already in your library as <code>[@${esc(r.existing)}]</code>. Adding again only puts it into the project.`;
      show("existing");
      $("add").textContent = "Add to project";
    }
    $("add").focus();
  } catch (e) { fail(e.message); }
}

$("add").onclick = async () => {
  $("add").disabled = true;
  try {
    const project = $("project").value.trim();
    try { localStorage.setItem("citrello-last-project", project); } catch (e) {}
    const r = await post("/api/clip/add", {rec, project});
    key = r.key;
    show("found", false); show("done");
    $("doneMsg").innerHTML = `${r.created ? "Added" : "Already in your library"}: <code>[@${esc(key)}]</code>${project ? " · project " + esc(project) : ""}`;
    $("copy").focus();
  } catch (e) { $("add").disabled = false; fail(e.message); }
};
$("copy").onclick = async () => { try { await navigator.clipboard.writeText(`[@${key}]`); $("copy").textContent = "Copied ✓"; } catch (e) {} };
["close", "close2"].forEach((id) => $(id).onclick = () => window.close());
document.addEventListener("keydown", (e) => { if (e.key === "Escape") window.close(); });
start();
</script>
</body>
</html>
