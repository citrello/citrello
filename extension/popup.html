<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add to Citrello</title>
<style>
  :root { --cobalt: #1d3f8f; --lemon: #f6d646; --leaf: #3e7b4f; --bg: #f6f8fd; --card: #fff; --ink: #14213d; --muted: #4a5774;
          --line: #d5def0; --sky: #eaf0fb; --ok: #2f6b40; --ok-soft: #e1f0e5; --warn: #8a5a00; --warn-soft: #fff1c7; --err: #b3261e; --err-soft: #fde3e1; }
  @media (prefers-color-scheme: dark) {
    :root { --cobalt: #8fb0ff; --bg: #0f1730; --card: #17213f; --ink: #e8edf8; --muted: #a9b5d3; --line: #2b3a63; --sky: #1e2c52;
            --ok: #7fd09a; --ok-soft: #173326; --warn: #f0c45a; --warn-soft: #3a2e10; --err: #ff8a80; --err-soft: #3d1c1a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 380px; background: var(--bg); color: var(--ink); font: 14px/1.45 Figtree, system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--cobalt); color: #fff; }
  header b { font: 400 18px Gloock, Georgia, serif; } header b span { color: var(--lemon); }
  header a { color: #dfe6f7; font-size: 12px; }
  main { padding: 12px 14px 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .title { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font: 700 11.5px Figtree, sans-serif; padding: 1px 8px; border-radius: 99px; background: var(--sky); color: var(--cobalt); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--err-soft); color: var(--err); }
  .ft { margin-top: 8px; font-size: 12.5px; color: var(--muted); } .ft.ok { color: var(--ok); font-weight: 600; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  button { font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; border-radius: 9px; cursor: pointer; }
  button.primary { background: var(--cobalt); color: #fff; border-color: var(--cobalt); flex: 1; }
  button:disabled { opacity: .55; cursor: default; }
  .notice { padding: 9px 12px; border-radius: 9px; font-size: 13px; margin-top: 10px; background: var(--sky); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); } .notice.err { background: var(--err-soft); color: var(--err); }
  .notice.warn { background: var(--warn-soft, #fff1c7); color: var(--warn, #8a5a00); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  code { font: 700 12.5px Figtree, sans-serif; color: var(--cobalt); background: var(--sky); padding: 1px 7px; border-radius: 6px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--cobalt); border-radius: 50%;
          animation: s 1s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .small { font-size: 12px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header><b>citr<span>ello</span></b><a href="#" id="openApp">Open Citrello</a></header>
<main>
  <div id="loading" class="card"><span class="spin"></span><span id="loadingText">Looking up this page…</span></div>
  <div id="found" class="hidden">
    <div class="card">
      <div class="title" id="title"></div>
      <div class="meta" id="meta"></div>
      <div class="tags" id="tags"></div>
      <div class="ft" id="ft">Full text: looking on the page…</div>
    </div>
    <div class="notice ok hidden" id="existing"></div>
    <label for="project">Project (optional)</label>
    <input id="project" list="projects" placeholder="e.g. the paper you're writing" autocomplete="off">
    <datalist id="projects"></datalist>
    <div class="row"><button class="primary" id="add">Add to library</button></div>
  </div>
  <div id="done" class="hidden">
    <div class="notice ok" id="doneMsg"></div>
    <div class="row"><button class="primary" id="copy">Copy citation marker</button></div>
  </div>
  <div id="error" class="notice err hidden"></div>
  <p class="small" id="hint" style="margin:10px 0 0">Shortcut: <b id="shortcut">Alt+Shift+C</b></p>
</main>
<script src="grab.js"></script>
<script src="follow.js"></script>
<script src="popup.js"></script>
</body>
</html>
